name: Error2Expert CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Backend Build & Test (Java 21 + Spring Boot)
  backend-build:
    name: Spring Boot Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test-compile

  # 2. Python ML Service Tests (FastAPI + Classifiers + FAISS)
  ml-service-tests:
    name: Python ML Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd ml-service
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Test Suite
        env:
          EMBEDDING_ENGINE: lightweight
        run: |
          cd ml-service
          python -m pytest tests/

  # 3. React Frontend Build & Lint (Node 20 + Vite)
  frontend-build:
    name: React Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build Static Assets
        run: |
          cd frontend
          npm run build
