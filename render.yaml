# ==============================================================================
# Error2Expert — Render Infrastructure as Code (Blueprint)
# Deploy with 1-click on https://render.com
# Specification: https://render.com/docs/blueprint-spec
# ==============================================================================

version: "1"

# 1. Managed PostgreSQL Database
databases:
  - name: error2expert-db
    plan: free
    databaseName: codememory
    user: postgres
    region: oregon
    ipAllowList: []

# 2. Application Services
services:
  # Python ML Microservice (FastAPI + Sentence-Transformers + FAISS)
  - type: web
    name: error2expert-ml-service
    runtime: python
    plan: free
    region: oregon
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: EMBEDDING_ENGINE
        value: "auto"

  # Spring Boot Central Backend (Java 21 + Spring Data JPA)
  - type: web
    name: error2expert-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/dashboard/summary
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: error2expert-db
          property: connectionString
      - key: JPA_DDL_AUTO
        value: update
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: error2expert-ml-service
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"

  # React Analytics Dashboard (Dark Mode UI)
  - type: web
    name: error2expert-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: error2expert-backend
          property: host
          path: /api
